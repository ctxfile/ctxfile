# Fly.io deployment for the hosted relay (sync.ctxfile.dev). The Dockerfile
# needs the REPO ROOT as its build context (it COPYs packages/core), so deploy
# from the repo root with an explicit context and Dockerfile path:
#   fly deploy . --config packages/relay/fly.toml --dockerfile packages/relay/Dockerfile
# Prereqs (FOUNDER-ACTIONS §2.1): fly app + volume, then
#   fly secrets set CTXFILE_RELAY_ORG=org-ctxfile
#   fly secrets set CTXFILE_RELAY_MASTER_KEY="$(openssl rand -base64 32)" -a ctxfile-relay
# The master key wraps every Standard vault's data key. As a Fly secret it
# never lands on the relay_data volume or its snapshots. The relay refuses to
# start without it (CTXFILE_RELAY_REQUIRE_SECRET_KEY below), so a forgotten
# secret fails the health check and the deploy rolls back instead of quietly
# minting a key file on the volume.
# Moving off an older key file (first deploy with this setting), once:
#   fly ssh console -a ctxfile-relay -C "node /app/packages/relay/dist/cli.js keyring rewrap"
#   fly ssh console -a ctxfile-relay -C "node /app/packages/relay/dist/cli.js keyring retire-file"
# Rotating later: set the new key, put the old one in
# CTXFILE_RELAY_MASTER_KEY_PREVIOUS, run 'keyring rewrap', then drop PREVIOUS.
# Registration is closed here in [env] AND belongs in secrets: hosted vaults are
# provisioned by the Sync subscription flow, never open signup.

app = "ctxfile-relay"
primary_region = "iad"

# No [build] section: flyctl resolves a config-relative dockerfile path and
# doubles it from a repo-root context; pass --dockerfile explicitly (see above).

[env]
  CTXFILE_RELAY_HOST = "0.0.0.0"
  CTXFILE_RELAY_PORT = "5959"
  CTXFILE_RELAY_DATA = "/data"
  CTXFILE_RELAY_PUBLIC_URL = "https://sync.ctxfile.dev"
  # Belt-and-suspenders: closed by config so a forgotten secret cannot leave
  # public vault creation open on the hosted relay.
  CTXFILE_RELAY_REGISTRATION = "closed"
  CTXFILE_RELAY_REQUIRE_SECRET_KEY = "1"

[[mounts]]
  source = "relay_data"
  destination = "/data"

[http_service]
  internal_port = 5959
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"
